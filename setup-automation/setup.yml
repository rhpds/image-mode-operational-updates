---
# SETUP — Environment Setup (standalone playbook, no main.yml)
#
# This lab provisions a nested-virt image-mode environment on a single build
# host: a local TLS registry, an initial (v1) bootc image, and that image booted
# as a nested libvirt guest ("bootc-vm"). The heavy lifting lives in the proven
# setup-rhel.sh, which must run ON the build host VM (libvirt/virt-install can't
# run on the runner pod). So rather than a pure `hosts: localhost` playbook, this
# self-contained playbook adds the bastion from the platform-injected BASTION_*
# environment and executes the setup script there with `become`.
#
# PHASE-1 VERIFICATION POINTS (confirm on first provision):
#   - BASTION_HOST / BASTION_PORT / BASTION_USER / BASTION_PASSWORD are injected
#     by the ZT platform for the runtime playbooks; confirm they are also present
#     for this setup playbook.
#   - GIT_REPO_URL / GIT_REPO_REF are injected so setup-rhel.sh can sparse-check
#     out examples/ from this lab's repo.
#   - REGISTRY_PULL_TOKEN (registry.redhat.io pull secret) is injected.
#   - config/secrets.yaml (ZeroSSL EAB creds) decrypts with the platform vault id.

- name: Create inventory
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add bastion host
      ansible.builtin.add_host:
        name: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') }}"
        ansible_ssh_host: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') }}"
        ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') }}"
        ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
        ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"

- name: Provision the image-mode build host
  hosts: all:!localhost
  gather_facts: false
  tasks:
    - ansible.builtin.wait_for_connection:

    - name: Set config_host variable with ansible_host value
      ansible.builtin.set_fact:
        config_host: "{{ ansible_host }}"

    - name: Create a directory for the setup script
      ansible.builtin.file:
        path: "/tmp/setup-scripts/"
        state: directory
        mode: "0755"

    - name: Check if setup-<host>.sh exists
      ansible.builtin.stat:
        path: "./setup-{{ config_host }}.sh"
      delegate_to: localhost
      register: r_script_test

    - name: Copy setup script to the build host
      when: r_script_test.stat.exists
      ansible.builtin.copy:
        src: "./setup-{{ ansible_host }}.sh"
        dest: "/tmp/setup-scripts/setup-{{ ansible_host }}.sh"
        mode: "0755"

    - name: Include secrets (ZeroSSL EAB credentials)
      ansible.builtin.include_vars: ../config/secrets.yaml

    - name: Execute setup script on the build host
      when: r_script_test.stat.exists
      ansible.builtin.shell: "sh /tmp/setup-scripts/setup-{{ ansible_host }}.sh > /tmp/setup-scripts/setup-{{ ansible_host }}.log 2>&1"
      become: true
      register: r_result
      environment:
        REGISTRY_PULL_TOKEN: "{{ lookup('ansible.builtin.env', 'REGISTRY_PULL_TOKEN') }}"
        GUID: "{{ lookup('ansible.builtin.env', 'GUID') }}"
        DOMAIN: "{{ lookup('ansible.builtin.env', 'DOMAIN') }}"
        ZEROSSL_EAB_KEY_ID: "{{ zerossl_eab_key_id }}"
        ZEROSSL_HMAC_KEY: "{{ zerossl_hmac_key }}"
        GIT_REPO: "{{ lookup('ansible.builtin.env', 'GIT_REPO_URL') }}"
        GIT_BRANCH: "{{ lookup('ansible.builtin.env', 'GIT_REPO_REF') }}"

    - name: Write script result to file
      when: r_result is defined
      ansible.builtin.copy:
        content: "{{ r_result.stdout | default(r_result.stderr) | default(r_result) }}"
        dest: "/tmp/{{ ansible_host }}-setup-script.out"
      delegate_to: localhost

    - name: Fail if setup failed
      when:
        - r_result is defined
        - r_result.rc != 0
      ansible.builtin.fail:
        msg: "Setup failed"
