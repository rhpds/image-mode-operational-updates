---
# HEALTHCHECK — Module 1 environment readiness check
# Verifies all infrastructure is ready before a student starts Module 1:
#   - Build host (SSH, podman, registry container, examples files)
#   - Registry (TLS certs, HTTPS response, initial v1.0 image present)
#   - Bootc VM (running, SSH accessible, bootc tooling, v1.0 booted, clean state)
#
# Non-destructive: does not modify any lab state. Should complete in under 90 seconds.
# Exit 0 = healthy and ready for Module 1, non-zero = unhealthy.

- name: Build inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add bastion host (build host)
      ansible.builtin.add_host:
        name: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') }}"
        ansible_ssh_host: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') }}"
        ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') }}"
        ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
        ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
        groups: build_host

- name: Module 1 Healthcheck
  hosts: all:!localhost
  gather_facts: false
  become: true
  tasks:
    - name: Verify SSH connectivity to build host
      ansible.builtin.ping:

    - name: "=== Build Host Verification ==="
      ansible.builtin.debug:
        msg: "Verifying build host infrastructure..."

    - name: Include build host verification tasks
      ansible.builtin.include_tasks: tasks/verify_build_host.yml

    - name: "=== Registry Verification ==="
      ansible.builtin.debug:
        msg: "Verifying local registry configuration..."
      when: verify_registry | default(false)

    - name: Include registry verification tasks
      ansible.builtin.include_tasks: tasks/verify_registry.yml
      when: verify_registry | default(false)

    - name: "=== Bootc VM Verification ==="
      ansible.builtin.debug:
        msg: "Verifying nested bootc VM is ready..."
      when: verify_bootc_vm | default(false)

    - name: Include bootc VM verification tasks
      ansible.builtin.include_tasks: tasks/verify_bootc_vm.yml
      when: verify_bootc_vm | default(false)

    - name: "=== Healthcheck Complete ==="
      ansible.builtin.debug:
        msg: "✓ All Module 1 prerequisites verified. Lab is ready for students."
