---
# Registry verification tasks for Module 1 readiness
# Verifies: TLS certificates, registry HTTPS response, initial v1.0 image present

- name: Check registry TLS certificates
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ registry_url }}/fullchain.pem"
  register: r_registry_cert
  failed_when: false

- name: Check registry TLS private key
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ registry_url }}/privkey.pem"
  register: r_registry_key
  failed_when: false

- name: Fail if TLS certificates missing (with clear guidance)
  ansible.builtin.fail:
    msg: |
      ⚠️  Registry TLS certificates are missing

      Expected: /etc/letsencrypt/live/{{ registry_url }}/fullchain.pem
      Expected: /etc/letsencrypt/live/{{ registry_url }}/privkey.pem
      Status: {{ 'Missing' if not r_registry_cert.stat.exists else 'Found' }} fullchain.pem, {{ 'Missing' if not r_registry_key.stat.exists else 'Found' }} privkey.pem

      This usually means setup-automation did not complete successfully.

      Resolution:
        1. Check setup logs: cat /tmp/progress.log
        2. Look for certificate generation errors (certbot/ZeroSSL)
        3. Re-run setup: cd setup-automation && ansible-playbook setup.yml
        4. Re-run this healthcheck
  when: not r_registry_cert.stat.exists or not r_registry_key.stat.exists

- name: Check if registry responds on HTTPS
  ansible.builtin.uri:
    url: "https://{{ registry_url }}/v2/"
    validate_certs: true
    status_code: [200, 401]  # 401 = auth required (expected), 200 = ok
  register: r_registry_https
  failed_when: false
  ignore_errors: true

- name: Display registry HTTPS status
  ansible.builtin.debug:
    msg: |
      {% if r_registry_https.status is defined and r_registry_https.status in [200, 401] %}
      ✓ Registry responding on HTTPS with status {{ r_registry_https.status }}
      {% else %}
      ⚠️  Registry is not responding on HTTPS
      {% if r_registry_https.status is defined %}
      → Received HTTP {{ r_registry_https.status }} (expected 200 or 401)
      {% else %}
      → Connection failed (check if container is running and certs are valid)
      {% endif %}
      {% endif %}

- name: Fail if registry HTTPS not responding (with clear guidance)
  ansible.builtin.fail:
    msg: |
      ⚠️  Registry HTTPS endpoint is not responding correctly

      Expected: https://{{ registry_url }}/v2/ returns HTTP 200 or 401
      Actual: {{ r_registry_https.status | default('Connection failed') }}

      Resolution:
        1. Verify registry container is running: podman ps --filter name=registry
        2. Check registry logs: podman logs registry
        3. Verify TLS certificates are valid: ls -l /etc/letsencrypt/live/{{ registry_url }}/
        4. Test manually: curl -sk https://{{ registry_url }}/v2/
        5. If setup incomplete, re-run: cd setup-automation && ansible-playbook setup.yml
  when: r_registry_https.status is not defined or r_registry_https.status not in [200, 401]

- name: Check if initial v1.0 image is present in registry
  ansible.builtin.command: >
    skopeo inspect --no-tags docker://{{ registry_url }}/base
  register: r_initial_image
  failed_when: false
  changed_when: false

- name: Parse initial image inspection (if successful)
  ansible.builtin.set_fact:
    initial_image_manifest: "{{ r_initial_image.stdout | from_json }}"
  when: r_initial_image.rc == 0

- name: Display initial image information
  ansible.builtin.debug:
    msg: |
      {% if r_initial_image.rc == 0 %}
      ✓ Initial image {{ registry_url }}/base is present (Digest: {{ initial_image_manifest.Digest[:19] }}...)
      {% else %}
      ⚠️  Initial image {{ registry_url }}/base is NOT in registry
      → This image should be built and pushed during setup-automation
      {% endif %}

- name: Fail if initial image missing (with clear guidance)
  ansible.builtin.fail:
    msg: |
      ⚠️  Initial bootc image (v1.0) is not present in registry

      Expected image: {{ registry_url }}/base
      Status: Not found in registry

      This image is built and pushed by setup-automation/setup-rhel.sh.
      Its absence means setup did not complete successfully.

      Resolution:
        1. Check setup progress: cat /tmp/progress.log
        2. Look for errors during:
           - Initial image build (podman build)
           - Image push to registry (podman push)
        3. Verify registry is accessible: podman push usually fails if registry has cert issues
        4. Re-run setup: cd setup-automation && ansible-playbook setup.yml
        5. Re-run this healthcheck

      Debug commands:
        - podman images | grep base  (check if image exists locally)
        - skopeo inspect docker://{{ registry_url }}/base  (check registry)
  when: r_initial_image.rc != 0
