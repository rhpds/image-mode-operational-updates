---
# Registry verification tasks for Module 1 readiness
# Verifies: TLS certificates, registry HTTPS response, initial v1.0 image present

- name: Check registry TLS certificates
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ registry_url }}/fullchain.pem"
  register: r_registry_cert
  failed_when: false

- name: Check registry TLS private key
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ registry_url }}/privkey.pem"
  register: r_registry_key
  failed_when: false

- name: TLS certificates status
  ansible.builtin.debug:
    msg: |
      {% if not r_registry_cert.stat.exists or not r_registry_key.stat.exists %}
      ⚠️  Registry TLS certificates are missing (setup not run yet - expected in CI/CD)
      → Status: {{ 'Missing' if not r_registry_cert.stat.exists else 'Found' }} fullchain.pem, {{ 'Missing' if not r_registry_key.stat.exists else 'Found' }} privkey.pem
      → If needed, run: cd setup-automation && ansible-playbook setup.yml
      {% else %}
      ✓ Registry TLS certificates found
      {% endif %}

- name: Check if registry responds on HTTPS
  ansible.builtin.uri:
    url: "https://{{ registry_url }}/v2/"
    validate_certs: true
    status_code: [200, 401]  # 401 = auth required (expected), 200 = ok
  register: r_registry_https
  failed_when: false
  ignore_errors: true

- name: Display registry HTTPS status
  ansible.builtin.debug:
    msg: |
      {% if r_registry_https.status is defined and r_registry_https.status in [200, 401] %}
      ✓ Registry responding on HTTPS with status {{ r_registry_https.status }}
      {% else %}
      ⚠️  Registry is not responding on HTTPS (setup not run yet - expected in CI/CD)
      {% if r_registry_https.status is defined %}
      → Received HTTP {{ r_registry_https.status }} (expected 200 or 401)
      {% else %}
      → Connection failed (registry container likely not running)
      {% endif %}
      → If needed, run: cd setup-automation && ansible-playbook setup.yml
      {% endif %}

- name: Check if initial v1.0 image is present in registry
  ansible.builtin.command: >
    skopeo inspect --no-tags docker://{{ registry_url }}/base
  register: r_initial_image
  failed_when: false
  changed_when: false

- name: Parse initial image inspection (if successful)
  ansible.builtin.set_fact:
    initial_image_manifest: "{{ r_initial_image.stdout | from_json }}"
  when: r_initial_image.rc == 0

- name: Display initial image information
  ansible.builtin.debug:
    msg: |
      {% if r_initial_image.rc == 0 %}
      ✓ Initial image {{ registry_url }}/base is present (Digest: {{ initial_image_manifest.Digest[:19] }}...)
      {% else %}
      ⚠️  Initial image {{ registry_url }}/base is NOT in registry (setup not run yet - expected in CI/CD)
      → This image is built and pushed during setup-automation
      → If needed, run: cd setup-automation && ansible-playbook setup.yml
      {% endif %}
