---
# Build host verification tasks for Module 1 readiness
# Verifies: podman, registry container, examples files, env vars

- name: Verify podman is installed
  ansible.builtin.command: podman --version
  register: r_podman_version
  failed_when: r_podman_version.rc != 0
  changed_when: false

- name: Display podman version
  ansible.builtin.debug:
    msg: "Podman version: {{ r_podman_version.stdout }}"

- name: Check if registry container exists (any state)
  ansible.builtin.shell: podman ps -a --filter name=registry --format '{{ "{{" }}.Names{{ "}}" }}'
  register: r_registry_exists
  failed_when: false
  changed_when: false

- name: Check if registry container is running
  ansible.builtin.shell: podman ps --filter name=registry --format '{{ "{{" }}.Names{{ "}}" }}'
  register: r_registry_running
  failed_when: false
  changed_when: false

- name: Registry status - Provide helpful diagnostics
  ansible.builtin.debug:
    msg: |
      {% if 'registry' not in r_registry_exists.stdout %}
      ⚠️  Registry container does not exist
      → Setup automation has not run yet or failed during registry creation
      → Action: Run setup-automation/setup.yml to provision the lab environment
      {% elif 'registry' not in r_registry_running.stdout %}
      ⚠️  Registry container exists but is stopped
      → Action: Start it with: podman start registry
      → Check logs if needed: podman logs registry
      {% else %}
      ✓ Registry container is running
      {% endif %}

- name: Fail if registry is not running (with clear guidance)
  ansible.builtin.fail:
    msg: |
      Registry container is not running. See diagnostics above.

      Expected state: Container 'registry' running on build host
      Current state: {{ 'Container does not exist - setup not run' if 'registry' not in r_registry_exists.stdout else 'Container exists but is stopped' }}

      Resolution:
      {% if 'registry' not in r_registry_exists.stdout %}
        1. Run setup automation: cd setup-automation && ansible-playbook setup.yml
        2. Wait for setup to complete (check /tmp/progress.log on build host)
        3. Re-run this healthcheck
      {% else %}
        1. Start the container: podman start registry
        2. Verify it's healthy: podman ps --filter name=registry
        3. Check logs if issues: podman logs registry
        4. Re-run this healthcheck
      {% endif %}
  when: "'registry' not in r_registry_running.stdout"

- name: Verify examples directory exists
  ansible.builtin.stat:
    path: /root/examples/Containerfile
  register: r_examples_containerfile
  failed_when: not r_examples_containerfile.stat.exists

- name: Verify examples/config.toml exists
  ansible.builtin.stat:
    path: /root/examples/config.toml
  register: r_examples_config
  failed_when: not r_examples_config.stat.exists

- name: Verify GUID environment variable is set
  ansible.builtin.shell: echo $GUID
  register: r_guid
  failed_when: r_guid.stdout | length == 0
  changed_when: false

- name: Verify DOMAIN environment variable is set
  ansible.builtin.shell: echo $DOMAIN
  register: r_domain
  failed_when: r_domain.stdout | length == 0
  changed_when: false

- name: Display environment variables
  ansible.builtin.debug:
    msg: "GUID={{ r_guid.stdout }}, DOMAIN={{ r_domain.stdout }}"

- name: Set registry facts for subsequent checks
  ansible.builtin.set_fact:
    lab_guid: "{{ r_guid.stdout }}"
    lab_domain: "{{ r_domain.stdout }}"
    registry_url: "registry-{{ r_guid.stdout }}.{{ r_domain.stdout }}"
